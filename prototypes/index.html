<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Thử gallery WebGL</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1118; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; gap: 6px; padding: calc(10px + env(safe-area-inset-top)) 10px 10px; justify-content: center; flex-wrap: wrap; pointer-events: none; }
      .bar button { pointer-events: auto; min-height: 44px; padding: 0 14px; border: 1.5px solid rgba(255,255,255,.35); border-radius: 999px; background: rgba(20,12,18,.55); color: #fff; font: 600 14px/1 system-ui, sans-serif; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
      .bar button[aria-pressed='true'] { background: #fff; color: #7a3b5a; border-color: #fff; }
      .hint { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 5; text-align: center; font-size: 14px; color: #f5dde4; text-shadow: 0 1px 6px rgba(0,0,0,.6); pointer-events: none; padding: 0 70px; }
      .arrow { position: fixed; top: 50%; z-index: 5; width: 48px; height: 48px; margin-top: -24px; border: 0; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 30px; line-height: 1; cursor: pointer; }
      .arrow.prev { left: 8px; } .arrow.next { right: 8px; }
      .fps { position: fixed; left: 8px; bottom: 8px; z-index: 6; font: 12px ui-monospace, monospace; color: #7dff7d; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 4px; }
      .error { position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center; padding: 30px; text-align: center; background: #1a1118; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="bar" id="bar"></div>
    <button class="arrow prev" id="prev" aria-label="Trước">‹</button>
    <button class="arrow next" id="next" aria-label="Sau">›</button>
    <div class="hint" id="hint"></div>
    <div class="fps" id="fps"></div>
    <div class="error" id="error">Máy hoặc trình duyệt này không chạy được WebGL.</div>
    <script type="module" src="./lab.js"></script>
  </body>
</html>
